name: Build and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --directory backend --extra dev pytest
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
      - name: Create Kubernetes Secret
        env:
          ENV_VARS: ${{ secrets.ENV_VARS }}
        run: python3 scripts/create_kubernetes_secret.py k8s/bus-app-secrets.yaml
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push Docker images
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          KAKAO_MAP_KEY: ${{ secrets.KAKAO_MAP_KEY }}
        run: |
          API_IMAGE="$DOCKER_USERNAME/ptm_bus_calc-api:${GITHUB_SHA}"
          WEB_IMAGE="$DOCKER_USERNAME/ptm_bus_calc-web:${GITHUB_SHA}"
          docker build -t "$API_IMAGE" -f backend/Dockerfile backend
          docker build --build-arg VITE_KAKAO_MAP_KEY="$KAKAO_MAP_KEY" -t "$WEB_IMAGE" -f frontend/Dockerfile frontend
          docker push "$API_IMAGE"
          docker push "$WEB_IMAGE"
          echo "API_IMAGE=$API_IMAGE" >> "$GITHUB_ENV"
          echo "WEB_IMAGE=$WEB_IMAGE" >> "$GITHUB_ENV"
      - name: Send Kubernetes files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: k8s
          target: /tmp
      - name: Deploy to k3s through SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          port: ${{ secrets.SSH_PORT }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: API_IMAGE,WEB_IMAGE
          script: |
            kubectl apply -f /tmp/k8s/base/namespace.yaml
            kubectl apply -f /tmp/k8s/cert-manager/clusterissuer.yaml
            kubectl apply -f /tmp/k8s/bus-app-secrets.yaml
            kubectl apply -k /tmp/k8s/overlays/prod
            kubectl -n ptm-bus set image deployment/bus-api api=$API_IMAGE
            kubectl -n ptm-bus set image deployment/bus-web web=$WEB_IMAGE
            kubectl -n ptm-bus rollout status deployment/bus-api --timeout=180s
            kubectl -n ptm-bus rollout status deployment/bus-web --timeout=180s
            rm -rf /tmp/k8s
