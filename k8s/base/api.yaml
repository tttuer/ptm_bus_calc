apiVersion: v1
kind: Service
metadata:
  name: bus-api
spec:
  selector:
    app: bus-api
  ports:
    - port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bus-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bus-api
  template:
    metadata:
      labels:
        app: bus-api
    spec:
      containers:
        - name: api
          image: bus-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: bus-app-secrets
                  key: MONGODB_URI
            - name: MONGODB_DB
              value: bus_time
            - name: KAKAO_REST_API_KEY
              valueFrom:
                secretKeyRef:
                  name: bus-app-secrets
                  key: KAKAO_REST_API_KEY
            - name: ALLOWED_ORIGINS
              value: https://ptm.baeksung.kr
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
